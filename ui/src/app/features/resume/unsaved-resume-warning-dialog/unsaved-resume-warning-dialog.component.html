<h2 mat-dialog-title>Unsaved Resume Changes</h2>
<div mat-dialog-content>
  <p>{{ data.message }}</p>
</div>
<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="stayOnResume()">OK</button>
  <button mat-flat-button color="primary" type="button" (click)="saveLaterAndLeave()">Save later</button>
</div>
