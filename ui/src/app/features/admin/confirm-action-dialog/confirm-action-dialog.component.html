<h2 mat-dialog-title>{{ data.title }}</h2>
<div mat-dialog-content>
  <p>{{ data.message }}</p>
</div>
<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ data.cancelText || 'Cancel' }}</button>
  <button
    mat-flat-button
    type="button"
    [color]="data.isDanger ? 'warn' : 'primary'"
    (click)="confirm()"
  >
    {{ data.confirmText || 'Confirm' }}
  </button>
</div>
